
---
- name: Deploy DevOps Capstone Application
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Apply Kubernetes Deployment
      command: kubectl apply -f "{{ playbook_dir }}/../kubernetes/deployment.yaml"

    - name: Apply Kubernetes Service
      command: kubectl apply -f "{{ playbook_dir }}/../kubernetes/service.yaml"

    - name: Verify Kubernetes Deployment
      command: kubectl rollout status deployment/devops-capstone
