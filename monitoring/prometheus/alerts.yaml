# Example PrometheusRule for kube-prometheus-stack.
# Apply only after confirming the Prometheus Operator CRD is installed.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-capstone-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: devops-capstone.availability
      rules:
        - alert: DevOpsCapstoneDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="devops",deployment="devops-capstone"} < 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: DevOps Capstone has no available replicas
            description: The devops-capstone Deployment has had fewer than one available replica for 2 minutes.
        - alert: DevOpsCapstonePodRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="devops",pod=~"devops-capstone-.*"}[10m]) > 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: DevOps Capstone container restart spike
            description: A DevOps Capstone container restarted more than twice in 10 minutes.
